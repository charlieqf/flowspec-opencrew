[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = [
    ".git",
    ".venv",
    "backend/.venv",
    "frontend",
    "ToolLibrary",
    "StoryBoardRegression",
]

[tool.ruff.lint]
select = ["E9", "F401", "F811", "F821"]

[tool.ruff.lint.per-file-ignores]
"backend/opcrew_backend/koubo/koubo_storyboard/*.py" = ["F401", "F821"]
