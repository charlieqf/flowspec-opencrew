<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koubo TailFrame 整体绑定状态测试记录表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #d9e1ee;
      --text: #172033;
      --muted: #65728a;
      --blue: #4f46e5;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
      --gray: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 22px 28px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    button, .file-label {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 7px;
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button.danger { color: var(--red); }
    input[type="file"] { display: none; }
    main { padding: 18px 28px 32px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1180px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: top;
      padding: 8px;
    }
    th {
      background: #eef3fb;
      z-index: 1;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    input, textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 7px 8px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 72px; }
    .case-input { min-width: 150px; }
    .image-input { margin-bottom: 7px; }
    .preview {
      width: 104px;
      height: 78px;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: var(--gray);
      font-size: 12px;
      overflow: hidden;
      background: #f8fafc;
      cursor: zoom-in;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .status-pass { color: var(--green); }
    .status-fail { color: var(--red); }
    .status-blocked { color: var(--amber); }
    .status-pending { color: var(--gray); }
    .row-actions { width: 78px; }
    .small { font-size: 12px; color: var(--muted); }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      z-index: 20;
    }
    .lightbox.is-open { display: flex; }
    .lightbox-panel {
      max-width: min(1180px, 96vw);
      max-height: 92vh;
      display: grid;
      gap: 10px;
    }
    .lightbox img {
      max-width: 100%;
      max-height: calc(92vh - 52px);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      object-fit: contain;
    }
    .lightbox-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: #fff;
      font-size: 13px;
    }
    .lightbox-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lightbox-close {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
    }
    @media (max-width: 760px) {
      header { padding: 18px 16px 12px; }
      main { padding: 14px 16px 24px; }
      .summary { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>整体绑定状态测试记录表（含 TailFrame）</h1>
    <div class="meta">
      <span>Task #4 / Session #5</span>
      <span>多 Shot / 多 Scene / Split / Merge / TailFrame</span>
      <span>本地自动保存：<b id="saveState">未保存</b></span>
      <span>JSON Key：koubo.tailFrameFull.bindingStatus.v2</span>
    </div>
    <div class="toolbar">
      <button class="primary" id="addRowBtn" type="button">添加案例</button>
      <button id="exportBtn" type="button">导出 JSON</button>
      <label class="file-label" for="importFile">导入 JSON</label>
      <input id="importFile" type="file" accept="application/json,.json">
      <button id="resetBtn" type="button">恢复模板</button>
      <button class="danger" id="clearBtn" type="button">清空本地记录</button>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="测试统计">
      <div class="stat"><b id="totalCount">0</b><span>案例总数</span></div>
      <div class="stat"><b id="passCount">0</b><span>通过</span></div>
      <div class="stat"><b id="failCount">0</b><span>失败</span></div>
      <div class="stat"><b id="blockedCount">0</b><span>阻断</span></div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>案例</th>
            <th>操作</th>
            <th>Should Be 图片</th>
            <th>测试结果</th>
            <th>是否通过</th>
            <th>批注</th>
            <th class="row-actions">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <p class="small">说明：Should Be 图片可填写截图路径、相对路径或 URL；导出 JSON 会保存全部表格内容，导入后会覆盖当前页面记录。</p>
  </main>

  <div class="lightbox" id="imageLightbox" aria-hidden="true">
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Should Be 图片预览">
      <div class="lightbox-top">
        <span class="lightbox-path" id="lightboxPath"></span>
        <button class="lightbox-close" id="lightboxClose" type="button">关闭</button>
      </div>
      <img id="lightboxImage" alt="Should Be 图片放大预览">
    </div>
  </div>

  <script>
    const STORAGE_KEY = "koubo.tailFrameFull.bindingStatus.v2";
    const EXPORT_NAME = "koubo_tailframe_full_binding_status_test_records.json";
    const TEST_TITLE = "Koubo 整体绑定状态测试集（含 TailFrame）";
    const headers = ["案例", "操作", "Should Be 图片", "测试结果", "是否通过", "批注"];
    const templateRows = [
      {
        caseName: "TF-01 多范围完整基线",
        operation: "在 StoryBoard 逐个清目标范围的 Audio / 新图 / 新视频 / 终视频；先点击各 Scene 的“生成TTS”；再点击底部工具条“生成计划”，在 Video Plan 中执行目标范围。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_audio_done_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：StoryBoard、Image Plan、Video Only Plan、Video Plan 与接口槽位一致；已完成 Final 的 Segment 有 TailFrame。"
      },
      {
        caseName: "TF-02 当前结构 Segment 基线",
        operation: "点击底部工具条“生成计划”，打开 Video Plan，观察 Shot_001 / Scene_001、Shot_002、Shot_003 的 Segment 展示和顶部计数。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：shot_001 / scene_001 的两条 Dialogue 合成一个 Segment；Segment asset key 以 srt_0001 为主。"
      },
      {
        caseName: "TF-03 多 Dialogue Segment Audio",
        operation: "在 StoryBoard 中分别点击第一条和第二条 Dialogue 的 Audio 删除按钮；每次刷新 Video Plan / Video Only Plan；再从右侧“历史素材”拖回 Audio。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_audio_done_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：任一 Dialogue Audio 缺失时 Segment Audio 未完成；补回后恢复完成；Raw / Final / TailFrame 不变。"
      },
      {
        caseName: "TF-04 Split Scene",
        operation: "在 StoryBoard 第二条 Dialogue 下方点击“Scene”分割按钮，形成新的 Scene；点击底部“生成计划”查看 Segment 数量。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：一个 Scene 变两个 Scene / 两个 Segment；第一段 srt_0001，第二段 srt_0004。"
      },
      {
        caseName: "TF-05 Split Scene 后第二段首帧",
        operation: "Split Scene 后保持 Video Plan 弹窗打开，观察第二个 Segment 的首帧输入状态；再回到 StoryBoard 看第二段的新图槽位是否为空。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：第二段没有自己的原图 / 新图时，依赖第一段 TailFrame；不继承第一段 Raw / Final 完成态。"
      },
      {
        caseName: "TF-06 Split Scene 后 TailFrame 缺失",
        operation: "在右侧“历史素材”查看 srt_0001_TailFrame.jpg；如果界面提供尾帧删除入口，则只删除 TailFrame 后刷新 Video Plan；如果没有入口，记录为阻断。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_video_plan_sync_proxy_error_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：第二段 Video Plan blocked、待补首帧或明确缺前置 TailFrame；不得清 Audio / 新图 / Raw / Final。"
      },
      {
        caseName: "TF-07 Merge Scene 恢复",
        operation: "在 StoryBoard 新 Scene 顶部点击“Merge Up”，把第二条 Dialogue 合回原 Scene；刷新后重新打开“生成计划”。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：回到 shot_001 / scene_001 双 Dialogue；Video Plan 回到一个 Segment；旧 split execution 不压过当前结构。"
      },
      {
        caseName: "TF-08 Split Shot",
        operation: "在 StoryBoard 第二条 Dialogue 下方点击“Shot”分割按钮，形成新的 Shot；点击底部“生成计划”查看新 Shot 首段。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：第二条 Dialogue 进入新 Shot 第一个 Scene；新 Shot 首段以 srt_0004 为 first dialogue asset key。"
      },
      {
        caseName: "TF-09 跨 Shot TailFrame 继承",
        operation: "Split Shot 后打开 Video Plan，观察新 Shot 首个 Segment 的首帧来源；确认后用“Merge Up”恢复原结构。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：新 Shot 首段没有视觉输入时只继承上一个 Shot 最后一段 TailFrame，不继承 Raw / Final 完成态。"
      },
      {
        caseName: "TF-10 shot_002 / scene_002 清新图",
        operation: "滚动到 Shot_002 / Scene_002，在对应 Dialogue 的“新图”槽位点击删除；刷新图像计划、视频计划、生成计划；再从历史素材拖回新图。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_after_drag_restore_image_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：Image Plan / Video Only Plan 新图跟随变化；Raw / Final / TailFrame 不被级联清。"
      },
      {
        caseName: "TF-11 shot_002 / scene_003 清 Raw",
        operation: "滚动到 Shot_002 / Scene_003，在“新视频”槽位点击删除；刷新 Video Only Plan 和 Video Plan；再从历史素材拖回 Raw。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_video_only_done_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：Raw 状态变化；Final 如果存在且绑定仍完成；Final 不能反向点亮 Raw。"
      },
      {
        caseName: "TF-12 shot_003 / scene_004 清 Final",
        operation: "滚动到 Shot_003 / Scene_004，在“终视频”槽位点击删除；刷新 Video Only Plan 和 Video Plan；再从历史素材拖回 Final。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_before_drag_restore_image_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：Raw 保留；Video Only Plan 回到可 Confirm；Video Plan 回到 Final from Raw 或 Sync from Raw。"
      },
      {
        caseName: "TF-13 Scene 间 TailFrame 依赖",
        operation: "打开 Video Plan，检查 Shot_002 中后一个 Scene 的首帧来源；如果界面提供 TailFrame 删除入口，只清前一段 TailFrame 后刷新。",
        shouldImage: "koubo_binding_status_should_images/koubo_multishot_video_plan_ui_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：后一段只把 TailFrame 当执行输入，不能把 TailFrame 当新图、Raw 或 Final 完成态。"
      },
      {
        caseName: "TF-14 随机组合：Audio + TailFrame",
        operation: "在 Shot_002 / Scene_002 先删除 Audio；如果有尾帧删除入口再删除 TailFrame。刷新计划后，只从历史素材拖回 Audio。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_audio_done_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：补 Audio 只恢复 Audio / SegmentAudio；TailFrame 依赖仍未恢复。"
      },
      {
        caseName: "TF-15 随机组合：补 TailFrame",
        operation: "在 TF-14 后，如果 TailFrame 曾被清除，从历史素材恢复或重新生成 TailFrame；刷新 Video Plan 观察后续段状态。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_after_drag_restore_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：依赖该尾帧的后续段恢复可计划 / 可执行；Audio / 新图 / Raw / Final 不被改写。"
      },
      {
        caseName: "TF-16 随机组合：Final 独立补回",
        operation: "在 Shot_003 / Scene_004 删除终视频后，只从右侧历史素材拖回 Final，不拖 Raw；刷新 Video Plan / Video Only Plan。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_after_drag_restore_image_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：只恢复 Final；不得反向改变 Raw 判断。"
      },
      {
        caseName: "TF-17 结束状态恢复",
        operation: "回到 StoryBoard 左侧导航，确认 Shot / Scene 数量恢复；再依次打开图像计划、视频计划、生成计划，确认状态与 StoryBoard 槽位一致。",
        shouldImage: "koubo_binding_status_should_images/koubo_scene_regression_full_chain_after_drag_restore_20260617.png",
        result: "",
        passed: "pending",
        note: "Should：结构无残留；StoryBoard、Image Plan、Video Only Plan、Video Plan 状态一致。"
      }
    ];

    let rows = [];

    function emptyRow() {
      return { caseName: "", operation: "", shouldImage: "", result: "", passed: "pending", note: "" };
    }

    function loadRows() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return structuredClone(templateRows);
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed.rows) ? parsed.rows : Array.isArray(parsed) ? parsed : structuredClone(templateRows);
      } catch {
        return structuredClone(templateRows);
      }
    }

    function saveRows() {
      const payload = { title: TEST_TITLE, headers, updatedAt: new Date().toISOString(), rows };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload, null, 2));
      document.getElementById("saveState").textContent = new Date().toLocaleString();
      updateStats();
    }

    function statusLabel(value) {
      const map = { pending: "未测", pass: "通过", fail: "失败", blocked: "阻断" };
      return map[value] || "未测";
    }

    function render() {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      rows.forEach((row, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input class="case-input" data-field="caseName" data-index="${index}" value="${escapeAttr(row.caseName)}"></td>
          <td><textarea data-field="operation" data-index="${index}">${escapeText(row.operation)}</textarea></td>
          <td>
            <input class="image-input" data-field="shouldImage" data-index="${index}" value="${escapeAttr(row.shouldImage)}" placeholder="图片路径或 URL">
            <div class="preview" data-preview="${escapeAttr(row.shouldImage)}">${row.shouldImage ? `<img alt="Should Be" src="${escapeAttr(row.shouldImage)}">` : "无图片"}</div>
          </td>
          <td><textarea data-field="result" data-index="${index}">${escapeText(row.result)}</textarea></td>
          <td>
            <select data-field="passed" data-index="${index}" class="status-${escapeAttr(row.passed || "pending")}">
              ${["pending", "pass", "fail", "blocked"].map(value => `<option value="${value}" ${row.passed === value ? "selected" : ""}>${statusLabel(value)}</option>`).join("")}
            </select>
          </td>
          <td><textarea data-field="note" data-index="${index}">${escapeText(row.note)}</textarea></td>
          <td class="row-actions"><button class="danger" type="button" data-delete="${index}">删除</button></td>
        `;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll("input, textarea, select").forEach(el => {
        el.addEventListener("input", updateFromInput);
        el.addEventListener("change", updateFromInput);
      });
      tbody.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
          rows.splice(Number(btn.dataset.delete), 1);
          render();
          saveRows();
        });
      });
      tbody.querySelectorAll("[data-preview]").forEach(preview => {
        preview.addEventListener("click", () => {
          const src = preview.dataset.preview;
          if (src) openLightbox(src);
        });
      });
      updateStats();
    }

    function updateFromInput(event) {
      const index = Number(event.target.dataset.index);
      const field = event.target.dataset.field;
      rows[index][field] = event.target.value;
      if (field === "shouldImage" || field === "passed") render();
      saveRows();
    }

    function updateStats() {
      document.getElementById("totalCount").textContent = rows.length;
      document.getElementById("passCount").textContent = rows.filter(r => r.passed === "pass").length;
      document.getElementById("failCount").textContent = rows.filter(r => r.passed === "fail").length;
      document.getElementById("blockedCount").textContent = rows.filter(r => r.passed === "blocked").length;
    }

    function exportJson() {
      const payload = { title: TEST_TITLE, headers, exportedAt: new Date().toISOString(), rows };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = EXPORT_NAME;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJson(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const nextRows = Array.isArray(parsed.rows) ? parsed.rows : Array.isArray(parsed) ? parsed : null;
          if (!nextRows) throw new Error("JSON 中没有 rows 数组");
          rows = nextRows.map(row => ({ ...emptyRow(), ...row }));
          render();
          saveRows();
        } catch (error) {
          alert("导入失败：" + error.message);
        }
      };
      reader.readAsText(file);
    }

    function escapeAttr(value) {
      return String(value || "").replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;");
    }

    function escapeText(value) {
      return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;");
    }

    function openLightbox(src) {
      document.getElementById("lightboxImage").src = src;
      document.getElementById("lightboxPath").textContent = src;
      document.getElementById("imageLightbox").classList.add("is-open");
      document.getElementById("imageLightbox").setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      document.getElementById("imageLightbox").classList.remove("is-open");
      document.getElementById("imageLightbox").setAttribute("aria-hidden", "true");
      document.getElementById("lightboxImage").src = "";
    }

    document.getElementById("addRowBtn").addEventListener("click", () => {
      rows.push(emptyRow());
      render();
      saveRows();
    });
    document.getElementById("exportBtn").addEventListener("click", exportJson);
    document.getElementById("importFile").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) importJson(file);
      event.target.value = "";
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("恢复模板会覆盖当前表格，确定继续？")) return;
      rows = structuredClone(templateRows);
      render();
      saveRows();
    });
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("清空本地记录？导出的 JSON 不会受影响。")) return;
      localStorage.removeItem(STORAGE_KEY);
      rows = structuredClone(templateRows);
      render();
      document.getElementById("saveState").textContent = "未保存";
      updateStats();
    });
    document.getElementById("imageLightbox").addEventListener("click", event => {
      if (event.target.id === "imageLightbox") closeLightbox();
    });
    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLightbox();
    });

    rows = loadRows();
    render();
  </script>
</body>
</html>
