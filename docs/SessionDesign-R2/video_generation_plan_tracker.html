      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --slate-950: #020617;
      --indigo-50: #eef2ff;
      --indigo-100: #e0e7ff;

      --indigo-600: #4f46e5;
      --indigo-700: #4338ca;
      --emerald-500: #10b981;
      --blue-500: #3b82f6;
      --amber-50: #fffbeb;
      --amber-200: #fde68a;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --white: #ffffff;

    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--slate-800);
      background:
        radial-gradient(circle at 18% 0%, rgba(148,163,184,.32), transparent 28%),
        linear-gradient(135deg, rgba(15,23,42,.55), rgba(71,85,105,.38)),
        var(--slate-100);
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, .60);
      backdrop-filter: blur(12px);
    }
    .modal {
      width: 100%;
      max-width: 1152px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
    }
    .header {
      z-index: 10;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--slate-200);
      background: var(--white);
    }
    .header-left { display: flex; align-items: center; gap: 32px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .brand-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 12px;
      color: var(--indigo-600);
      background: var(--indigo-100);
    }
    h1 { margin: 0; color: var(--slate-800); font-size: 18px; line-height: 1.35; font-weight: 800; letter-spacing: -.01em; }
    .substats { display: flex; align-items: center; gap: 12px; margin-top: 4px; color: var(--slate-500); font-size: 11px; line-height: 1; font-weight: 600; white-space: nowrap; }
    .substats span { display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 4px; height: 4px; border-radius: 999px; background: var(--slate-300); }
    .top-progress {
      display: flex;
      align-items: center;
      gap: 24px;
      padding-left: 32px;
      border-left: 1px solid var(--slate-200);
    }
    .top-progress-item { display: flex; align-items: center; gap: 8px; color: var(--slate-700); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 800; white-space: nowrap; }
    .top-progress-item .den { color: var(--slate-400); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; color: var(--slate-400); border: 0; border-radius: 999px; background: transparent; cursor: pointer; transition: .15s ease; }
    .icon-btn:hover { color: var(--slate-600); background: var(--slate-100); }
    .body { flex: 1; overflow: hidden; display: flex; background: rgba(248,250,252,.50); }
    .scroll { flex: 1; overflow-y: auto; padding: 32px; position: relative; }
    .scroll::-webkit-scrollbar { width: 12px; }
    .scroll::-webkit-scrollbar-track { background: transparent; }
    .scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,.72); border-radius: 999px; border: 3px solid var(--slate-50); }
    .timeline { max-width: 768px; margin: 0 auto; display: grid; gap: 32px; }
    .shot { position: relative; }
    .shot-head {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--slate-200);
      background: rgba(248,250,252,.9);
      backdrop-filter: blur(4px);
    }
    .shot-title { color: var(--slate-800); font-size: 18px; line-height: 1.4; font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; }
    .execute-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      min-width: 153px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: var(--indigo-600);
      color: white;
      box-shadow: 0 8px 18px rgba(99,102,241,.2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      transition: .15s ease;
    }
    .execute-btn svg { width: 16px; height: 16px; flex: none; }
    .execute-btn:hover { background: var(--indigo-700); transform: translateY(-1px); }
    .execute-btn:disabled { cursor: default; background: var(--slate-400); transform: none; box-shadow: none; }
    .scene {
      position: relative;
      margin-left: 24px;
      padding-left: 24px;
      border-left: 2px solid var(--slate-200);
    }
    .scene + .scene { margin-top: 24px; }
    .scene-node { position: absolute; left: -9px; top: 0; width: 16px; height: 16px; border-radius: 999px; background: var(--slate-200); border: 4px solid var(--slate-50); }
    .scene-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .scene-title { color: var(--slate-700); font-size: 14px; font-weight: 800; }
    .time-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 0;
      border-radius: 4px;
      background: rgba(226,232,240,.5);
      color: var(--slate-500);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .segments { display: grid; gap: 12px; }
    .segment-card {
      padding: 16px;
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      background: var(--white);
      box-shadow: 0 1px 2px rgba(15,23,42,.06);
      transition: .16s ease;
    }
    .segment-card:hover, .segment-card.is-focused { border-color: var(--indigo-300); box-shadow: 0 4px 12px rgba(15,23,42,.10); }
    .segment-card.is-done { border-color: rgba(16,185,129,.35); }
    .segment-card.is-blocked { border-color: rgba(245,158,11,.55); }
    .segment-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .segment-meta { display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap; }
    .segment-index { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; background: var(--slate-100); color: var(--slate-500); font-size: 10px; font-weight: 800; }
    .duration-input, .time-input {
      width: auto;
      border: 0;
      outline: 0;
      text-align: left;
    }
    .time-input { min-width: 142px; }
    .duration-input { width: 54px; padding: 0; color: var(--slate-400); background: transparent; font-size: 12px; font-weight: 700; }
    .duration-input:focus, .time-input:focus { outline: 2px solid var(--indigo-300); background: white; }
    .status-select {
      appearance: none;
      border: 1px solid var(--amber-200);
      border-radius: 999px;
      padding: 2px 10px 2px 20px;
      background:
        radial-gradient(circle at 10px 50%, transparent 0 4px, transparent 4px),
        var(--amber-50);
      color: var(--amber-500);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: .025em;
      cursor: pointer;
    }
    .status-wrap { position: relative; display: inline-flex; align-items: center; }
    .status-wrap::before { content: ''; position: absolute; left: 8px; width: 10px; height: 10px; border: 1.75px solid currentColor; border-radius: 999px; color: var(--amber-500); pointer-events: none; }
    .status-wrap.done .status-select { color: var(--emerald-500); border-color: rgba(16,185,129,.25); background: rgba(16,185,129,.06); }

      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 4px 10px;
      border: 1px solid var(--slate-200);
      border-radius: 6px;
      background: var(--white);
      color: var(--slate-700);
      box-shadow: 0 1px 2px rgba(15,23,42,.06);
      cursor: pointer;
      transition: .15s ease;

    .task-badge span { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }

    .task-badge.done::after { background: var(--emerald-500); }
    .task-badge.inactive {

      background: var(--slate-100);
      color: var(--slate-400);
      box-shadow: none;
      opacity: .60;
      filter: blur(.5px);

    .task-badge.inactive svg { color: var(--slate-400); }
    .task-badge.inactive::after { display: none; }
    .task-badge:focus-visible, .task-badge:hover { outline: 0; border-color: var(--indigo-300); }
    .hidden-params {
      display: none;

      margin-top: 14px;
      padding-top: 14px;

    .segment-card.show-params .hidden-params { display: grid; }
    .param-field { display: grid; gap: 4px; color: var(--slate-400); font-size: 9px; font-weight: 800; letter-spacing: .10em; text-transform: uppercase; }
    .param-field input { width: 100%; height: 30px; border: 1px solid var(--slate-200); border-radius: 6px; padding: 0 8px; color: var(--slate-600); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 11px; outline: 0; }

    body.dark { color: var(--slate-100); background: var(--slate-950); }
    body.dark .modal { background: var(--slate-950); border-color: var(--slate-800); }
    body.dark .header { background: var(--slate-900); border-color: var(--slate-800); }

    body.dark .scene-node { background: var(--slate-700); border-color: var(--slate-950); }

    body.dark .task-badge::after { border-color: var(--slate-900); }
    body.dark .task-badge.inactive { background: rgba(30,41,59,.5); color: var(--slate-500); }
    body.dark .pipeline { border-color: rgba(30,41,59,.6); }
    body.dark .time-chip, body.dark .segment-index, body.dark .end-pill { background: var(--slate-800); color: var(--slate-400); border-color: var(--slate-800); }
    body.dark .hidden-params, body.dark .shot-head { border-color: var(--slate-800); }
    body.dark .param-field input { background: var(--slate-950); border-color: var(--slate-800); color: var(--slate-300); }
    @media (max-width: 900px) {

      .modal { height: 92vh; }
      .header { align-items: flex-start; }

      .scroll { padding: 24px 18px; }
      .scene { margin-left: 8px; padding-left: 18px; }
      .shot-head { align-items: flex-start; flex-direction: column; }
      .hidden-params { grid-template-columns: 1fr; }
    }

      const n = Number(seconds) || 0;
      const m = Math.floor(n / 60);
      const s = Math.floor(n % 60);
      const ms = Math.floor((n % 1) * 100);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
    }
    function parseTimePair(value, segment) {
      const match = String(value).match(/(\d+):(\d+)\.(\d+)\s*[→\-]+\s*(\d+):(\d+)\.(\d+)/);
      if (!match) return;
      const toSec = (m, s, ms) => Number(m) * 60 + Number(s) + Number(ms) / 100;
      segment.start = round3(toSec(match[1], match[2], match[3]));
      segment.end = round3(toSec(match[4], match[5], match[6]));
      segment.duration = round3(segment.end - segment.start);
    }
    function round3(n) { return Math.round(Number(n) * 1000) / 1000; }
    function fmtSeconds(n) { return `${(Number(n) || 0).toFixed(2)}s`; }
    function allSegments() {
      const rows = [];
      for (const shot of plan.shots || []) for (const scene of shot.scenes || []) for (const segment of scene.segments || []) rows.push({ shot, scene, segment });
      return rows;
    }
    function execFor(segment) {
      if (!state.execution[segment.segment_id]) state.execution[segment.segment_id] = { status: 'planned', done: { audio:false, image:false, video:false, lipsync:false } };
      return state.execution[segment.segment_id];
    }
    function taskOn(segment, key) {
      const tasks = segment.tasks || {};
      if (key === 'audio') return !!tasks.need_audio || (segment.dialogue_audio_tasks || []).length > 0;
      if (key === 'image') return !!tasks.need_image;
      if (key === 'video') return !!tasks.need_video;
      if (key === 'lipsync') return !!tasks.need_lipsync;
      return false;
    }
    function taskTotal(key) {
      const summary = plan.summary || {};
      if (key === 'audio') return summary.need_audio_count || 0;
      if (key === 'image') return summary.need_image_count || 0;
      if (key === 'video') return summary.need_video_count || 0;
      if (key === 'lipsync') return summary.need_lipsync_count || 0;
      return 0;
    }
    function taskDoneCount(key) {
      let total = 0;
      for (const {segment} of allSegments()) {
        const exec = execFor(segment);
        if (!exec.done[key]) continue;
        if (key === 'audio') total += (segment.dialogue_audio_tasks || []).length || (taskOn(segment, key) ? 1 : 0);
        else total += taskOn(segment, key) ? 1 : 0;
      }
      return Math.min(total, taskTotal(key));
    }
    function isSegmentDone(segment) {
      const exec = execFor(segment);
      return ['audio','image','video','lipsync'].every(key => !taskOn(segment, key) || exec.done[key]);
    }
    function refreshStatusFromTasks(segment) {
      const exec = execFor(segment);
      if (exec.status === 'blocked') return;
      exec.status = isSegmentDone(segment) ? 'done' : Object.values(exec.done).some(Boolean) ? 'running' : 'planned';
    }
    function renderHeader() {
      const summary = plan.summary || {};
      document.getElementById('substats').innerHTML = `
        <span>${icon('film')} ${summary.shot_count || 0} Shots</span><i class="dot"></i>
        <span>${icon('layers')} ${summary.scene_count || 0} Scenes</span><i class="dot"></i>
        <span>${icon('layoutList')} ${summary.segment_count || 0} Segments</span>`;
      const specs = [
        ['audio','mic','Audio Tasks','var(--indigo-500)'],
        ['image','image','Image Tasks','var(--emerald-500)'],
        ['video','clapperboard','Video Tasks','var(--blue-500)'],
        ['lipsync','audioLines','Lip Sync Tasks','var(--amber-500)']
      ];
      document.getElementById('topProgress').innerHTML = specs.map(([key, iconName, title, color]) => `
        <div class="top-progress-item" title="${title}"><span style="width:16px;height:16px;color:${color}">${icon(iconName)}</span><span>${taskDoneCount(key)} <span class="den">/ ${taskTotal(key)}</span></span></div>
      `).join('');
    }
    function renderTimeline() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = (plan.shots || []).map((shot, index) => `
        <section class="shot" id="${esc(shot.shot_id)}">
          <div class="shot-head">
            <div class="shot-title">${esc(shot.shot_id.replace('_', ' '))}</div>
            ${index === 0 ? `<button class="execute-btn" id="executeBtn">${state.executing ? icon('clock') + ' Executing...' : icon('play') + ' Execute Plan'}</button>` : ''}
          </div>
          <div class="shot-scenes">${(shot.scenes || []).map(scene => renderScene(scene)).join('')}</div>
        </section>
      `).join('') + `<div class="end-plan"><div class="end-pill">${icon('checkCircle')} End of Plan</div></div>`;
      bindEvents();
    }
    function renderScene(scene) {
      return `<section class="scene" id="${esc(scene.scene_id)}">
        <div class="scene-node"></div>
        <div class="scene-head"><div class="scene-title">${esc(scene.scene_id.replace('_', ' '))}</div><span class="time-chip">${time(scene.start)} - ${time(scene.end)}</span></div>
        <div class="segments">${(scene.segments || []).map(segment => renderSegment(segment)).join('')}</div>
      </section>`;
    }
    function renderSegment(segment) {
      const exec = execFor(segment);
      refreshStatusFromTasks(segment);
      const statusClass = exec.status === 'done' ? 'done' : '';
      const cardClass = exec.status === 'done' ? 'is-done' : exec.status === 'blocked' ? 'is-blocked' : '';
      const focusClass = segment.segment_id === 'shot_001_scene_001_segment_001' ? 'is-focused' : '';
      return `<article class="segment-card ${cardClass} ${focusClass}" data-segment="${esc(segment.segment_id)}">
        <div class="segment-top">
          <div class="segment-meta">
            <div class="segment-index">S${segment.segment_index}</div>
            <input class="time-chip time-input" data-kind="time" value="${time(segment.start)} → ${time(segment.end)}" title="编辑起止时间，格式 00:00.20 → 00:04.58" />
            <input class="duration-input" data-kind="duration" value="${fmtSeconds(segment.planned_video_duration || segment.duration)}" title="编辑 planned duration，例如 4.38s" />
          </div>
          <label class="status-wrap ${statusClass}"><select class="status-select" data-kind="status"><option value="planned" ${exec.status==='planned'?'selected':''}>Planned</option><option value="running" ${exec.status==='running'?'selected':''}>Running</option><option value="done" ${exec.status==='done'?'selected':''}>Completed</option><option value="blocked" ${exec.status==='blocked'?'selected':''}>Blocked</option></select></label>
        </div>
        <div class="pipeline">
          <div class="pipeline-title">Execution Pipeline</div>
          <div class="pipeline-row">
            ${taskBadge(segment, 'audio', 'mic', 'Audio Gen')}<span class="arrow">→</span>
            ${taskBadge(segment, 'image', 'image', 'First Frame')}<span class="arrow">→</span>
            ${taskBadge(segment, 'video', 'clapperboard', 'Render Video')}<span class="arrow">→</span>
            ${taskBadge(segment, 'lipsync', 'audioLines', 'Lip Sync')}
          </div>
        </div>
        <div class="hidden-params">
          ${paramInput('Image Prompt', segment.planned_outputs?.image_prompt_path || '', 'image_prompt_path')}
          ${paramInput('Image', segment.planned_outputs?.image_path || '', 'image_path')}
          ${paramInput('Segment Audio', segment.planned_outputs?.segment_audio_path || '', 'segment_audio_path')}
          ${paramInput('Video Prompt', segment.planned_outputs?.video_prompt_path || '', 'video_prompt_path')}
          ${paramInput('Video', segment.planned_outputs?.video_path || '', 'video_path')}
        </div>
      </article>`;
    }
    function taskBadge(segment, key, iconName, label) {
      const active = taskOn(segment, key);
      const done = execFor(segment).done[key];
      return `<button class="task-badge ${active ? '' : 'inactive'} ${done ? 'done' : ''}" data-task="${key}" ${active ? '' : 'aria-disabled="true"'} title="${active ? '点击标记完成/未完成' : '该 segment 不需要此环节'}">${icon(iconName)}<span>${label}</span></button>`;
    }
    function paramInput(label, value, key) {
      return `<label class="param-field">${esc(label)}<input data-output="${esc(key)}" value="${esc(value)}" /></label>`;
    }
    function bindEvents() {
      document.querySelectorAll('.segment-card').forEach(card => {
        const row = allSegments().find(({segment}) => segment.segment_id === card.dataset.segment);
        if (!row) return;
        const segment = row.segment;
        const exec = execFor(segment);
        card.addEventListener('dblclick', event => {
          if (event.target.closest('button, input, select')) return;
          card.classList.toggle('show-params');
        });
        card.querySelectorAll('[data-task]').forEach(btn => btn.addEventListener('click', () => {
          const key = btn.dataset.task;
          if (!taskOn(segment, key)) return;
          exec.done[key] = !exec.done[key];
          refreshStatusFromTasks(segment);
          saveState();
          renderHeader();
          renderTimeline();
        }));
        card.querySelector('[data-kind="status"]').addEventListener('change', event => {
          exec.status = event.target.value;
          if (exec.status === 'done') ['audio','image','video','lipsync'].forEach(key => { if (taskOn(segment, key)) exec.done[key] = true; });
          saveState(); renderHeader(); renderTimeline();
        });
        card.querySelector('[data-kind="time"]').addEventListener('change', event => {
          parseTimePair(event.target.value, segment);
          saveState(); renderTimeline();
        });
        card.querySelector('[data-kind="duration"]').addEventListener('change', event => {
          const n = Number(String(event.target.value).replace('s',''));
          if (Number.isFinite(n)) {
            segment.planned_video_duration = round3(n);
            segment.duration = round3(n);
            if (segment.planned_outputs) segment.planned_outputs.video_duration_seconds = round3(n);
          }
          saveState(); renderTimeline();
        });
        card.querySelectorAll('[data-output]').forEach(input => input.addEventListener('change', event => {
          segment.planned_outputs = segment.planned_outputs || {};
          segment.planned_outputs[event.target.dataset.output] = event.target.value;
          saveState(false);
        }));
      });
      const executeBtn = document.getElementById('executeBtn');
      if (executeBtn) executeBtn.addEventListener('click', simulateExecute);
    }
    function simulateExecute() {
      if (state.executing) return;
      state.executing = true;
      saveState(); renderTimeline();
      const segments = allSegments().map(x => x.segment);
      let i = 0;
      const order = ['audio', 'image', 'video', 'lipsync'];
      const timer = setInterval(() => {
        const segment = segments[Math.floor(i / order.length)];
        const key = order[i % order.length];
        if (segment) {
          const exec = execFor(segment);
          if (taskOn(segment, key)) exec.done[key] = true;
          refreshStatusFromTasks(segment);
        }
        i++;
        renderHeader(); renderTimeline(); saveState();
        if (i >= segments.length * order.length) {
          clearInterval(timer);
          state.executing = false;
          saveState(); renderTimeline(); toast('执行计划已标记完成');
        }
      }, 120);
    }
    function toast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(window.__toast);
      window.__toast = setTimeout(() => el.classList.remove('show'), 1600);
    }
    function esc(value) {
      return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }
    function exportPlan() {
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'video_generation_plan.modified.json'; a.click();
      URL.revokeObjectURL(url);
    }
    document.getElementById('themeBtn').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(); saveState();
    });
    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
      toast('Plan 已关闭，刷新页面可重新打开');
    });
    document.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') { event.preventDefault(); exportPlan(); }
      if (event.key.toLowerCase() === 'p') document.querySelector('.segment-card:hover')?.classList.toggle('show-params');
    });
    function applyTheme() {
      document.body.classList.toggle('dark', state.theme === 'dark');
      document.getElementById('themeBtn').innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
      document.getElementById('closeBtn').innerHTML = icon('x');
    }
    mountStaticIcons(); applyTheme(); renderHeader(); renderTimeline(); saveState();
  </script>
</body>
</html>
